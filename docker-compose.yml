# 用法：docker compose up -d
services:
  chat2app:
    build: .
    container_name: chat2app
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      API_TOKEN: "${API_TOKEN}"
      RATE_LIMIT_PER_HOUR: "${RATE_LIMIT_PER_HOUR:-30}"
      BASE_URL: "${BASE_URL}"
      BROWSER_VALIDATION: "${BROWSER_VALIDATION:-false}"
      BROWSER_EXECUTABLE: "${BROWSER_EXECUTABLE:-}"
      GENERATION_CONCURRENCY: "${GENERATION_CONCURRENCY:-2}"
      GENERATION_MAX_RETRIES: "${GENERATION_MAX_RETRIES:-2}"
    volumes:
      - ./apps-data:/app/apps-data
      - ./tasks-data:/app/tasks-data
