<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Chat2App · 聊天生成小应用</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--card:#1c2330;--line:#2a3342;--txt:#e6edf3;--dim:#8b98a8;--acc:#4f8cff;--ok:#2fbf71;--err:#ff5f6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overscroll-behavior:none}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#4f8cff,#7a5cff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
header h1{font-size:16px;margin:0}
header .tag{margin-left:auto;font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .gear{margin-left:8px;width:32px;height:32px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:15px;cursor:pointer;flex-shrink:0}
#chat{flex:1;overflow-y:auto;padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.msg{max-width:84%;padding:11px 14px;border-radius:14px;line-height:1.65;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot.streaming{border-color:var(--acc)}
.msg .cur{display:inline-block;width:8px;height:16px;background:var(--acc);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.msg.err{background:rgba(255,95,109,.1);border-color:var(--err);color:var(--err)}
.hint{font-size:12.5px;color:var(--dim);background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 13px;line-height:1.7}
#result{margin-top:4px}
.result-card{background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:14px}
.result-card h3{margin:0 0 8px;font-size:15px}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.urlbox{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font-family:inherit;font-size:13px;border:none;border-radius:9px;padding:8px 12px;background:var(--card);color:var(--txt);border:1px solid var(--line);cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.detail{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.6}
.detail.ok{color:var(--ok)}
.detail.err{color:var(--err)}
#composer{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);position:sticky;bottom:0}
#input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--txt);font-size:15px;outline:none;font-family:inherit;resize:none;max-height:120px}
#input:focus{border-color:var(--acc)}
#send{background:var(--acc);color:#fff;border:none;border-radius:12px;padding:0 18px;font-size:15px;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.5;cursor:not-allowed}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.examples button{font-size:12px;border-radius:999px;padding:6px 11px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:99;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
#modal.on{display:flex}
#appsModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;flex-direction:column;z-index:100;padding:14px;padding-top:calc(14px + env(safe-area-inset-top))}
#appsModal.on{display:flex}
.apps-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.apps-head h3{margin:0;font-size:17px;flex:1}
.apps-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.app-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.app-item .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.app-item .t .v{font-size:11px;color:var(--acc);background:rgba(93,136,255,.13);border:1px solid rgba(93,136,255,.3);border-radius:999px;padding:1px 8px}
.app-item .m{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.6}
.app-item .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.app-item .btns button{font-size:12px;padding:7px 12px}
.app-item .btns button.del{border-color:var(--err);color:var(--err)}
.app-item .btns button.del.confirm{background:var(--err);color:#fff;border-color:var(--err)}
.app-empty{text-align:center;color:var(--dim);font-size:13px;padding:40px 0;line-height:1.8}
.detail.change{color:var(--acc);background:rgba(93,136,255,.08);border:1px solid rgba(93,136,255,.25);border-radius:9px;padding:8px 11px;margin-top:10px}
.guide{background:var(--bg2);border:1px dashed var(--line);border-radius:11px;padding:10px 12px;margin-top:10px}
.guide .g-title{font-size:12.5px;font-weight:600;color:var(--txt);margin-bottom:6px}
.guide .g-item{font-size:12px;color:var(--dim);line-height:1.8}
.steps{display:flex;flex-direction:column;gap:5px;margin:2px 0 4px;padding:9px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;max-width:88%;align-self:flex-start}
.step{font-size:12.5px;color:var(--dim);line-height:1.6;display:flex;gap:8px}
.step .si{flex-shrink:0}
.preview{margin-top:10px}
.preview .pv-label{font-size:12px;color:var(--dim);margin-bottom:6px}
.preview iframe{width:100%;height:440px;border:1px solid var(--line);border-radius:12px;background:#fff;display:block}
.preview .pv-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.preview .pv-top .pv-label{font-size:12px;color:var(--dim);flex:1}
.preview .pv-top button{font-size:12px;padding:6px 12px}
#pvFull{position:fixed;inset:0;background:#0a0e14;z-index:200;display:none;flex-direction:column}
#pvFull.on{display:flex}
#pvFull .pv-head{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
#pvFull .pv-head span{flex:1;font-size:14px;font-weight:600;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pvFull .pv-head button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px}
#pvFull iframe{flex:1;width:100%;border:none;background:#fff}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:360px}
.mbox h3{margin:0 0 6px;font-size:16px}
.mbox p{font-size:13px;color:var(--dim);line-height:1.7;margin:0 0 14px}
.mbox input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--txt);font-size:14px;outline:none}
.mbox .row{margin-top:14px}
</style>
</head>
<body>
<header>
  <div class="logo">P</div>
  <h1>Chat2App</h1>
  <span class="tag" id="target">…</span>
  <button class="gear" id="appsBtn" title="应用列表">📁</button>
  <button class="gear" id="gear" title="访问口令">⚙️</button>
</header>
<div id="chat">
  <div class="hint">💡 先描述第一个需求 → 生成应用初版；<strong>之后继续聊天，会在同一个应用上持续修改（网址不变）</strong>，直到你满意。生成的应用任何人都能立即打开，手机上还能"安装为应用"。</div>
  <div class="examples" id="examples">
    <button data-ex="帮我做一个番茄钟，25分钟专注+5分钟休息，要有进度环和提示音">🍅 番茄钟</button>
    <button data-ex="做一个记账小工具，按天记录收支，自动算本月结余，本地保存">💰 记账本</button>
    <button data-ex="做一个成语接龙小游戏，电脑先出题，玩家接龙，判分">🀄 成语接龙</button>
    <button data-ex="做一个倒计时纪念日小应用，支持添加多个纪念日并显示还剩多少天">🎂 纪念日</button>
  </div>
</div>
<div id="composer">
  <textarea id="input" placeholder="描述你想要的小应用…（回车发送，Shift+回车换行）"></textarea>
  <button id="send">发送</button>
</div>
<div id="toast"></div>
<div id="modal">
  <div class="mbox">
    <h3>访问口令</h3>
    <p>生成应用会消耗 DeepSeek 额度。设置口令后，只有知道口令的人能在这里生成应用；打开已生成的应用不受影响。</p>
    <input id="tokenInput" type="password" placeholder="输入访问口令（留空则关闭）">
    <div class="row">
      <button id="tokenSave" class="pri">保存</button>
      <button id="tokenClose">取消</button>
    </div>
  </div>
</div>
<div id="appsModal">
  <div class="apps-head">
    <h3>📁 我的应用</h3>
    <button id="appsClose">关闭</button>
  </div>
  <div class="apps-body" id="appsBody"></div>
</div>
<div id="pvFull">
  <div class="pv-head">
    <span id="pvFullTitle">应用预览</span>
    <button id="pvFullClose">✕ 关闭</button>
  </div>
  <iframe id="pvFullFrame" src="about:blank"></iframe>
</div>
<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat"), input = $("#input"), sendBtn = $("#send");
let busy = false, token = localStorage.getItem("pw_token") || "";
let sessionId = null, appVersion = 0, authRequired = false;

(async () => {
  try {
    const cfg = await (await fetch("/api/config")).json();
    authRequired = !!cfg.authRequired;
    $("#target").textContent = cfg.baseUrl.replace(/^https?:\/\//, "");
    if (!cfg.hasKey) addMsg("bot err", "⚠️ 服务端还没配置 DeepSeek API Key，请联系管理员。");
    else if (cfg.authRequired && !token) addMsg("bot", "这个工坊开启了访问口令。点右上角 ⚙️ 输入口令后即可使用。");
    else addMsg("bot", "描述你的第一个需求，我来生成应用的初版；之后继续聊，我会在同一个应用上不断修改，直到你满意。");
  } catch (e) { addMsg("bot err", "无法连接服务，请刷新重试。"); }
  const saved = localStorage.getItem("chat2app_session");
  if (saved) restoreSession(saved);
})();

/* ---------- 全屏预览（事件委托，兼容动态生成的展开按钮） ---------- */
document.addEventListener("click", (e) => {
  if (!e.target || !e.target.id) return;
  if (e.target.id === "pvExpand") {
    const frame = document.getElementById("appPreview");
    document.getElementById("pvFullTitle").textContent = "应用预览";
    document.getElementById("pvFullFrame").src = frame ? frame.src : "about:blank";
    document.getElementById("pvFull").classList.add("on");
  } else if (e.target.id === "pvFullClose") {
    document.getElementById("pvFull").classList.remove("on");
    document.getElementById("pvFullFrame").src = "about:blank"; // 停止后台播放
  }
});

// 恢复上次会话：回到同一个应用的上下文继续改
async function restoreSession(id) {
  try {
    const headers = {};
    if (token) headers.Authorization = "Bearer " + token;
    const resp = await fetch("/api/apps/" + id, { headers });
    if (resp.status === 401) {
      addMsg("bot", "↩️ 检测到上次未完成的应用会话，输入口令（⚙️）后刷新即可恢复。");
      return;
    }
    if (!resp.ok) { localStorage.removeItem("chat2app_session"); return; }
    const { app } = await resp.json();
    sessionId = app.id;
    appVersion = app.version;
    if (Array.isArray(app.history) && app.history.length) {
      for (const h of app.history) addMsg("user", h);
    }
    addMsg("bot", "↩️ 已恢复上次的会话：**" + app.title + "** v" + app.version + "，继续描述修改要求即可，预览会接着更新。");
    showResult({ id: app.id, sessionId: app.id, title: app.title, version: app.version, isIteration: false, url: app.url, deploy: { ok: true, detail: "已恢复上次会话，继续聊天即可继续修改" } });
  } catch (e) {
    addMsg("bot err", "恢复会话失败：" + e.message);
  }
}

function addMsg(kind, text) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function addStep(box, evt) {
  const d = document.createElement("div");
  d.className = "step";
  const ic = document.createElement("span");
  ic.className = "si";
  ic.textContent = evt.icon || "•";
  const tx = document.createElement("span");
  tx.className = "st";
  tx.textContent = evt.text || "";
  d.appendChild(ic);
  d.appendChild(tx);
  box.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.style.display = "none"), 2200);
}

$("#gear").addEventListener("click", () => {
  $("#tokenInput").value = token;
  $("#modal").classList.add("on");
});
$("#tokenClose").addEventListener("click", () => $("#modal").classList.remove("on"));
$("#tokenSave").addEventListener("click", () => {
  token = $("#tokenInput").value.trim();
  if (token) localStorage.setItem("pw_token", token);
  else localStorage.removeItem("pw_token");
  $("#modal").classList.remove("on");
  toast(token ? "口令已保存" : "已关闭口令");
});

/* ---------- 应用列表 ---------- */
$("#appsBtn").addEventListener("click", () => {
  if (authRequired && !token) { toast("请先点 ⚙️ 输入访问口令"); return; }
  $("#appsModal").classList.add("on");
  loadApps();
});
$("#appsClose").addEventListener("click", () => $("#appsModal").classList.remove("on"));

async function loadApps() {
  const body = $("#appsBody");
  body.innerHTML = '<div class="app-empty">加载中…</div>';
  try {
    const headers = {};
    if (token) headers.Authorization = "Bearer " + token;
    const resp = await fetch("/api/apps", { headers });
    if (resp.status === 401) {
      body.innerHTML = '<div class="app-empty">访问口令不对，请点 ⚙️ 重新填写。</div>';
      return;
    }
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const { apps } = await resp.json();
    renderApps(apps);
  } catch (e) {
    body.innerHTML = '<div class="app-empty">加载失败：' + escapeHtml(e.message) + "</div>";
  }
}

function fmtSize(n) {
  if (n > 1048576) return (n / 1048576).toFixed(1) + "MB";
  if (n > 1024) return Math.round(n / 1024) + "KB";
  return n + "B";
}
function fmtTime(t) {
  if (!t) return "";
  const d = new Date(t);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return sameDay ? "今天 " + hh + ":" + mm : d.getMonth() + 1 + "月" + d.getDate() + "日 " + hh + ":" + mm;
}

function renderApps(apps) {
  const body = $("#appsBody");
  if (!apps.length) {
    body.innerHTML = '<div class="app-empty">还没有生成过应用。<br>关掉这里，去聊天生成第一个吧！</div>';
    return;
  }
  body.innerHTML = "";
  for (const a of apps) {
    const item = document.createElement("div");
    item.className = "app-item";
    const verBadge = "v" + a.version + (a.versions ? "（历史 " + a.versions + " 版）" : "");
    const meta = [fmtTime(a.updatedAt), fmtSize(a.size), verBadge].filter(Boolean).join(" · ");
    item.innerHTML = `
      <div class="t">${escapeHtml(a.title)} <span class="v">${escapeHtml(verBadge)}</span></div>
      <div class="m">${escapeHtml(a.id)}<br>${escapeHtml(meta)}</div>
      <div class="btns">
        <button class="pri resume">继续编辑</button>
        <button class="open">打开</button>
        <button class="copy">复制链接</button>
        <button class="del">删除</button>
      </div>`;
    item.querySelector(".resume").addEventListener("click", () => {
      $("#appsModal").classList.remove("on");
      sessionId = null;
      appVersion = 0;
      const oldRw = document.getElementById("result");
      if (oldRw) oldRw.remove();
      addMsg("bot", "正在恢复「" + a.title + "」的会话…");
      restoreSession(a.id);
    });
    item.querySelector(".open").addEventListener("click", () => window.open(a.url, "_blank"));
    item.querySelector(".copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(a.url); toast("链接已复制 ✓"); }
      catch { toast("复制失败，请手动复制"); }
    });
    const delBtn = item.querySelector(".del");
    delBtn.addEventListener("click", async () => {
      if (!delBtn.classList.contains("confirm")) {
        delBtn.classList.add("confirm");
        delBtn.textContent = "确认删除？";
        setTimeout(() => { delBtn.classList.remove("confirm"); delBtn.textContent = "删除"; }, 3000);
        return;
      }
      try {
        const hdrs = {};
        if (token) hdrs.Authorization = "Bearer " + token;
        const resp = await fetch("/api/apps/" + a.id, { method: "DELETE", headers: hdrs });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        item.remove();
        toast("已删除 " + a.title);
        if (!body.querySelector(".app-item")) renderApps([]);
      } catch (e) {
        toast("删除失败：" + e.message);
        delBtn.classList.remove("confirm");
        delBtn.textContent = "删除";
      }
    });
    body.appendChild(item);
  }
}

document.querySelectorAll("#examples button").forEach((b) => {
  b.addEventListener("click", () => { input.value = b.dataset.ex; input.focus(); });
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);

function setInputPlaceholder() {
  input.placeholder = sessionId
    ? "继续描述修改要求…（会更新到当前应用）"
    : "描述你想要的小应用…（回车发送，Shift+回车换行）";
}

async function send() {
  const prompt = input.value.trim();
  if (!prompt || busy) return;
  busy = true;
  sendBtn.disabled = true;
  addMsg("user", prompt);
  input.value = "";
  const botMsg = addMsg("bot", "⏳ 正在连接…");
  const stepsBox = document.createElement("div");
  stepsBox.className = "steps";
  botMsg.after(stepsBox);
  let acc = "";
  try {
    const headers = { "Content-Type": "application/json" };
    if (token) headers.Authorization = "Bearer " + token;
    const body = { prompt };
    if (sessionId) body.sessionId = sessionId;
    const resp = await fetch("/api/generate", { method: "POST", headers, body: JSON.stringify(body) });
    if (resp.status === 401) {
      addMsg("bot err", "❌ 访问口令不对，点右上角 ⚙️ 重新填写。");
      botMsg.remove();
      return;
    }
    if (resp.status === 429) {
      const e = await resp.json().catch(() => ({}));
      addMsg("bot err", "❌ " + (e.error || "请求太频繁"));
      botMsg.remove();
      return;
    }
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e.error || "HTTP " + resp.status);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith("data: ")) continue;
        const evt = JSON.parse(part.slice(6));
        if (evt.type === "token") {
          acc += evt.text; // 只累计字数，不向用户倾倒代码
        } else if (evt.type === "status") {
          botMsg.textContent = "⏳ " + evt.text;
          chat.scrollTop = chat.scrollHeight;
        } else if (evt.type === "step") {
          addStep(stepsBox, evt);
        } else if (evt.type === "error") {
          throw new Error(evt.message);
        } else if (evt.type === "done") {
          botMsg.remove();
          // 保留步骤记录作为交互日志，追加完成标记
          const fin = document.createElement("div");
          fin.className = "step";
          const fi = document.createElement("span");
          fi.className = "si";
          fi.textContent = "🎉";
          const ft = document.createElement("span");
          ft.textContent = "完成 v" + evt.result.version;
          fin.appendChild(fi);
          fin.appendChild(ft);
          stepsBox.appendChild(fin);
          showResult(evt.result);
        }
      }
    }
    if (!acc && !document.getElementById("result")) throw new Error("流意外结束，请重试");
  } catch (e) {
    botMsg.classList.remove("streaming");
    botMsg.textContent = acc || "";
    addMsg("bot err", "❌ " + e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
  }
}

function showResult(r) {
  sessionId = r.sessionId;
  appVersion = r.version;
  localStorage.setItem("chat2app_session", r.sessionId);
  setInputPlaceholder();
  let wrap = document.getElementById("result");
  const isUpdate = r.isIteration && !!wrap;
  const depl = r.deploy && r.deploy.ok
    ? '<div class="detail ok">✅ ' + (r.deploy.detail || "已发布") + "，任何有链接的人都能立即打开</div>"
    : '<div class="detail err">⚠️ 发布未完成：' + (r.deploy ? r.deploy.detail : "") + "（文件已保存在本地）</div>";
  const head = isUpdate
    ? "✅ 「" + escapeHtml(r.title) + "」已更新到 v" + r.version
    : "🎉 「" + escapeHtml(r.title) + "」初版已生成";
  const changeLine = r.changes
    ? '<div class="detail change">📝 本次改动：' + escapeHtml(r.changes) + "</div>"
    : "";
  const rollbackBtn = r.version > 1 ? '<button id="rollback">↩️ 回退到上一版</button>' : "";
  const guide = `
    <div class="guide">
      <div class="g-title">🕹️ 怎么继续操作</div>
      <div class="g-item">1️⃣ 直接说想改什么，比如「把字体调大」「加个统计」</div>
      <div class="g-item">2️⃣ 上方的预览可以直接点按试用，不满意就继续说</div>
      <div class="g-item">3️⃣ 改坏了点「↩️ 回退到上一版」</div>
      <div class="g-item">4️⃣ 满意了复制链接，发给别人即可打开</div>
    </div>`;
  if (!wrap) {
    wrap = document.createElement("div");
    wrap.id = "result";
    chat.appendChild(wrap);
  }
  wrap.innerHTML = `
    <div class="result-card">
      <h3>${head}</h3>
      ${changeLine}
      <div class="preview">
        <div class="pv-top">
          <div class="pv-label">👀 实时预览（可直接操作，随修改实时刷新）</div>
          <button id="pvExpand">⛶ 展开</button>
        </div>
        <iframe id="appPreview" src="${escapeHtml(location.origin + "/apps/" + r.id + "/")}" loading="lazy"></iframe>
      </div>
      <div class="row">
        <div class="urlbox">${escapeHtml(r.url)}</div>
      </div>
      <div class="row">
        <button class="pri" id="copyUrl">复制网址</button>
        <button class="ok" id="shareUrl">分享</button>
        <button id="openUrl">打开</button>
        ${rollbackBtn}
      </div>
      ${depl}
      ${guide}
      <div class="detail">💬 继续聊天，我会在<strong>同一个链接</strong>上继续更新这个应用，预览也会跟着变。</div>
      <div class="row"><button id="newApp">🆕 新建应用</button></div>
    </div>`;
  chat.scrollTop = chat.scrollHeight;
  wrap.querySelector("#copyUrl").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(r.url); toast("网址已复制 ✓"); }
    catch { toast("复制失败，请长按网址手动复制"); }
  });
  wrap.querySelector("#shareUrl").addEventListener("click", async () => {
    const text = "我用 AI 生成了一个小应用「" + r.title + "」，点开就能用：" + r.url;
    if (navigator.share) {
      try { await navigator.share({ title: r.title, text, url: r.url }); return; } catch {}
    }
    try { await navigator.clipboard.writeText(text); toast("已复制，去微信/浏览器发给朋友吧 ✓"); }
    catch { toast("复制失败，请手动复制链接"); }
  });
  wrap.querySelector("#openUrl").addEventListener("click", () => window.open(r.url, "_blank"));
  if (r.version > 1) {
    wrap.querySelector("#rollback").addEventListener("click", async () => {
      const hdrs = {};
      if (token) hdrs.Authorization = "Bearer " + token;
      try {
        const resp = await fetch("/api/apps/" + r.id + "/rollback", { method: "POST", headers: hdrs });
        if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.error || "HTTP " + resp.status); }
        const rb = await resp.json();
        const iframe = wrap.querySelector("#appPreview");
        if (iframe) iframe.src = location.origin + "/apps/" + r.id + "/?v=" + Date.now();
        wrap.querySelector("h3").textContent = "↩️ 「" + rb.title + "」已回退到 v" + rb.version;
        if (rb.version <= 1) { const btn = wrap.querySelector("#rollback"); if (btn) btn.remove(); }
        r.version = rb.version;
        r.title = rb.title;
        toast("已回退到 v" + rb.version);
      } catch (e) {
        toast("回退失败：" + e.message);
      }
    });
  }
  wrap.querySelector("#newApp").addEventListener("click", () => {
    sessionId = null;
    appVersion = 0;
    localStorage.removeItem("chat2app_session");
    const rw = document.getElementById("result");
    if (rw) rw.remove();
    setInputPlaceholder();
    addMsg("bot", "好的，开始一个新应用。描述你的需求吧！");
  });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 聊天界面自身的 Service Worker：缓存外壳；/apps/ 下的子应用一律不拦截
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
